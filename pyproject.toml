[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg-framework"
version = "0.1.0"
description = "Extensible rPPG development framework skeleton"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Workspace Developer" }
]
dependencies = [
  "numpy"
]

[project.scripts]
rppg = "rppg_framework.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

